name: Publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wts.Calendar.AspNetCore.sln

      - name: Build
        run: dotnet build Wts.Calendar.AspNetCore.sln --configuration Release --no-restore

      - name: Run conformance checks
        run: dotnet run --project tests/Wts.Calendar.AspNetCore.Conformance/Wts.Calendar.AspNetCore.Conformance.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Wts.Calendar.AspNetCore/Wts.Calendar.AspNetCore.csproj --configuration Release --no-build --output artifacts

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: suman_wts

      - name: Publish package and symbols
        run: dotnet nuget push "artifacts/Wts.Calendar.AspNetCore.1.0.0.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
